name: code-check

on:
  push:
    branches:
      - django

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v1
        with:
          args: check .

  pytest:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-test.txt
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest predictor --junitxml=coverage_reports/junit/test-results.xml --cov=predictor --cov-report=html:coverage_reports/htmlcov --cov-report=xml:coverage_reports/coverage.xml
      - name: Upload test results and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage_reports/
